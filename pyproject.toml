[project]
name = "argdec"
version = "0.3.1"
description = "A decorator-based, declarative interface to Python's argparse for building hierarchical CLI applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Shakeeb Alireza", email = "shakeeb.alireza@gmail.com"}
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["argparse", "cli", "command-line", "declarative", "decorator"]

[project.urls]
Homepage = "https://github.com/shakfu/argdec"
Repository = "https://github.com/shakfu/argdec"
Changelog = "https://github.com/shakfu/argdec/blob/main/CHANGELOG.md"
Issues = "https://github.com/shakfu/argdec/issues"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "twine>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["argdec.py"]

[tool.pytest.ini_options]
testpaths = ["test_argdec.py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.coverage.run]
source = ["argdec"]
branch = true
omit = ["test_*.py", "demo.py", "archive/*", "examples/*"]

[tool.coverage.report]
# The suite covers every line and branch; anything deliberately excluded must
# carry an explicit `pragma: no cover` explaining why it is unreachable.
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
